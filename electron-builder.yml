appId: com.saidmix.pet-asistente
productName: Pet Asistente
copyright: Copyright © 2026 Said Avendaño
homepage: https://github.com/saidmix01/pet-asistente

directories:
  output: release
  buildResources: desktop/assets
  app: desktop

extraResources:
  - from: backend/dist/
    to: backend/
    filter:
      - "**/*"

files:
  - electron/**/*
  - renderer/dist/**/*
  - chat-renderer/**/*
  - config-renderer/**/*
  - assets/**/*
  - package.json

# ── Windows ────────────────────────────────────────────────
win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pet Asistente
  runAfterFinish: true

# ── macOS ─────────────────────────────────────────────────
mac:
  target:
    - dmg
    - zip
  icon: assets/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}

# ── Linux ─────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
  executableArgs:
    - "--ozone-platform=x11"
    - "--enable-transparent-visuals"
  icon: assets/icon.png
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
